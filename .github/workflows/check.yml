# The same checks the Obsidian community scanner runs, on every push.
#
# Finding out at submission time that the linter objects to something is a
# week of waiting; finding out here is a minute.

name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Builds main.js from src/ first: the bundle is where the files finally
      # see each other, so a name that exists in no file only fails there.
      - run: npm run lint

      - run: npm test
